<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Regent — every job, one search</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@500;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--panel:#0c0c0c;--line:#2a1014;--red:#c8102e;--red2:#8e0b21;--ink:#f3ece0;--mute:#9a9288;--r:10px}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 'Source Sans 3',system-ui,sans-serif}
h1,h2,h3{font-family:'Cinzel Decorative','Cinzel',serif;margin:0;letter-spacing:.02em}
header{padding:56px 20px 36px;text-align:center;background:radial-gradient(ellipse at top,#2b060d 0,#000 65%);border-bottom:1px solid var(--red2)}
.crown{width:46px;margin:0 auto 10px;display:block;fill:var(--red);animation:glow 3.2s ease-in-out infinite}
@keyframes glow{50%{filter:drop-shadow(0 0 10px var(--red))}}
h1{font-size:clamp(2rem,6vw,3.6rem);font-weight:900}header p{color:var(--mute);max-width:560px;margin:8px auto 26px}
.bar{display:flex;gap:8px;max-width:760px;margin:auto}
input,select,button{font:inherit;color:var(--ink)}
input,select{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;width:100%;transition:border .2s,box-shadow .2s}
input:focus,select:focus,button:focus-visible{outline:none;border-color:var(--red);box-shadow:0 0 0 3px #c8102e44}
.btn{background:linear-gradient(var(--red),var(--red2));border:0;border-radius:var(--r);padding:12px 22px;font-weight:600;cursor:pointer;transition:transform .15s,filter .2s;white-space:nowrap;text-decoration:none;display:inline-block}
.btn:hover{filter:brightness(1.15)}.btn:active{transform:scale(.96)}
.ghost{background:none;border:1px solid var(--red2)}
main{max-width:1180px;margin:auto;padding:24px 16px;display:grid;grid-template-columns:290px 1fr;gap:24px}
aside{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;align-self:start;position:sticky;top:12px}
aside h3{font-size:1rem;margin:0 0 12px}label{display:block;font-size:.85rem;color:var(--mute);margin:10px 0 4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.drop{border:1.5px dashed var(--red2);border-radius:var(--r);padding:16px;text-align:center;cursor:pointer;transition:background .2s}
.drop:hover,.drop.on{background:#c8102e18}.drop small{color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.chip{border:1px solid var(--red2);border-radius:99px;padding:1px 10px;font-size:.8rem;color:var(--ink)}
.chip.red{background:var(--red);border-color:var(--red)}
#status{color:var(--mute);margin:0 0 14px;min-height:26px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:12px;cursor:pointer;transition:border .2s,transform .2s;animation:in .35s both}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.card:hover{border-color:var(--red)}.card h3{font-size:1.1rem}.co{color:var(--mute)}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.more{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s}.card.open .more{grid-template-rows:1fr}
.more>div{overflow:hidden}.det{padding-top:14px;border-top:1px solid var(--line);margin-top:14px}
.det p{color:#cfc7ba;margin:0 0 12px}.contact{background:#000;border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:12px}
.contact a{color:#ff6b7f}.act{display:flex;flex-wrap:wrap;gap:8px}
.sk{height:96px;border-radius:14px;margin-bottom:12px;background:linear-gradient(90deg,#0c0c0c 25%,#1b0a0e 50%,#0c0c0c 75%);background-size:200%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
.empty{text-align:center;padding:60px 10px;color:var(--mute)}.empty h2{color:var(--ink);font-size:1.3rem;margin-bottom:8px}
.err{border:1px solid var(--red);background:#c8102e1a;border-radius:var(--r);padding:12px;margin-bottom:12px}
.fbtn{display:none}
@media(max-width:820px){main{grid-template-columns:1fr}aside{position:static;display:none}aside.show{display:block}.fbtn{display:block;margin:0 auto 14px}.bar{flex-direction:column}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<header>
<svg class="crown" viewBox="0 0 64 48"><path d="M4 40 0 8l16 14L32 0l16 22L64 8l-4 32z"/></svg>
<h1>Regent</h1><p>LinkedIn, Indeed and every board in between, searched once. Find the role, then apply in a tap.</p>
<form class="bar" id="f"><input id="q" placeholder="Job role or company, e.g. data analyst, Zoho" aria-label="Search"><button class="btn">Search jobs</button></form>
</header>
<main>
<aside id="side">
<h3>Refine</h3>
<label>Country</label><select id="country"></select>
<div class="two"><div><label>State</label><input id="state" placeholder="Tamil Nadu"></div><div><label>City</label><input id="city" placeholder="Chennai"></div></div>
<label>Area / radius</label><select id="radius"><option value="">Any distance</option><option>5</option><option>10</option><option>25</option><option>50</option><option>100</option></select>
<label>Salary per year</label><div class="two"><select id="salaryMin"></select><select id="salaryMax"></select></div>
<label>Experience (years)</label><div class="two"><select id="expMin"></select><select id="expMax"></select></div>
<button class="btn" style="width:100%;margin:16px 0" id="apply" type="button">Apply filters</button>
<h3>Match my résumé</h3>
<div class="drop" id="drop"><b>Upload résumé</b><br><small>PDF, DOCX or TXT · read once, never stored</small><input type="file" id="file" accept=".pdf,.docx,.txt" hidden></div>
<div id="profile"></div>
<label>Also search on</label><div class="act"><a class="btn ghost" id="li" target="_blank" rel="noopener">LinkedIn</a><a class="btn ghost" id="in" target="_blank" rel="noopener">Indeed</a></div>
</aside>
<section><button class="btn ghost fbtn" id="tog">Filters</button><p id="status" role="status"></p><div id="out"></div></section>
</main>
<script>
const $=id=>document.getElementById(id),E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const C={in:'India',us:'United States',gb:'United Kingdom',au:'Australia',ca:'Canada',de:'Germany',fr:'France',nl:'Netherlands',sg:'Singapore',nz:'New Zealand',za:'South Africa',es:'Spain',it:'Italy',pl:'Poland',br:'Brazil',mx:'Mexico'};
$('country').innerHTML=Object.entries(C).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');
const sal=[0,200000,400000,600000,1000000,1500000,2500000,5000000];
$('salaryMin').innerHTML='<option value="">Min pay</option>'+sal.slice(1).map(v=>`<option value="${v}">${v.toLocaleString()}</option>`).join('');
$('salaryMax').innerHTML='<option value="">Max pay</option>'+sal.slice(1).map(v=>`<option value="${v}">${v.toLocaleString()}</option>`).join('');
const yrs=[0,1,2,3,5,8,10,15];
$('expMin').innerHTML='<option value="">Min yrs</option>'+yrs.slice(1).map(v=>`<option>${v}</option>`).join('');
$('expMax').innerHTML='<option value="">Max yrs</option>'+yrs.slice(1).map(v=>`<option>${v}</option>`).join('');
const ids=['country','state','city','radius','salaryMin','salaryMax','expMin','expMax'];
const qs=()=>{const p=new URLSearchParams({q:$('q').value});ids.forEach(i=>$(i).value&&p.set(i,$(i).value));return p};
const skel=()=>$('out').innerHTML='<div class="sk"></div>'.repeat(5);
function links(){const q=encodeURIComponent($('q').value),l=encodeURIComponent($('city').value||$('state').value);
 $('li').href=`https://www.linkedin.com/jobs/search/?keywords=${q}&location=${l}`;$('in').href=`https://${$('country').value==='us'?'www':$('country').value}.indeed.com/jobs?q=${q}&l=${l}`}
function card(j,i){const sal=j.min||j.max?`${Math.round(j.min||j.max).toLocaleString()}${j.max&&j.min?'–'+Math.round(j.max).toLocaleString():''} / yr`:j.salaryText||'';
 const mail=j.emails[0]&&`mailto:${j.emails[0]}?subject=${encodeURIComponent('Application: '+j.title)}&body=${encodeURIComponent('Hello,\n\nI would like to apply for the '+j.title+' role (found via '+j.src+').\n\n')}`;
 const contact=(j.emails.length||j.phones.length)?`<div class="contact"><b>Listed by the employer</b><br>${j.emails.map(e=>`<a href="mailto:${E(e)}">${E(e)}</a>`).join('<br>')}${j.phones.map(p=>`<br><a href="tel:${E(p.replace(/[^\d+]/g,''))}">${E(p)}</a>`).join('')}</div>`:`<div class="contact co">No email or phone is publicly listed in this posting. Use the apply button.</div>`;
 return `<article class="card" style="animation-delay:${Math.min(i,8)*40}ms"><h3>${E(j.title)}</h3><div class="co">${E(j.company)} · ${E(j.location)}</div>
 <div class="meta">${j.score?`<span class="chip red">${j.score}% match</span>`:''}<span class="chip">${E(j.src)}</span>${j.remote?'<span class="chip">Remote</span>':''}${sal?`<span class="chip">${E(sal)}</span>`:''}${j.exp!=null?`<span class="chip">${j.exp}+ yrs</span>`:''}${(j.matched||[]).slice(0,4).map(m=>`<span class="chip">${E(m)}</span>`).join('')}</div>
 <div class="more"><div><div class="det"><p>${E(j.desc.slice(0,600))}…</p>${contact}<div class="act"><a class="btn" href="${E(j.url)}" target="_blank" rel="noopener">Apply on ${E(j.src)}</a>${mail?`<a class="btn ghost" href="${E(mail)}">Email employer</a>`:''}</div></div></div></div></article>`}
function show(d,msg){const bad=Object.entries(d.status||{}).filter(([,v])=>typeof v==='string');
 $('status').textContent=`${d.jobs.length} jobs${msg||''}`+(bad.length?` · ${bad.map(([k,v])=>k+' '+v).join('; ')}`:'');
 $('out').innerHTML=d.jobs.length?d.jobs.map(card).join(''):`<div class="empty"><h2>No matching jobs</h2>Try a broader role, remove the radius, or widen salary and experience.</div>`;
 document.querySelectorAll('.card').forEach(c=>c.onclick=e=>{if(!e.target.closest('a'))c.classList.toggle('open')})}
const fail=m=>{$('status').textContent='';$('out').innerHTML=`<div class="err"><b>Something went wrong.</b> ${E(m)}</div>`};
async function search(e){e&&e.preventDefault();links();skel();$('status').textContent='Searching every source…';
 try{const r=await fetch('/api/search?'+qs()),d=await r.json();if(!r.ok)throw Error(d.error);show(d)}catch(x){fail(x.message)}}
$('f').onsubmit=search;$('apply').onclick=search;$('tog').onclick=()=>$('side').classList.toggle('show');
$('drop').onclick=()=>$('file').click();
['dragover','dragleave','drop'].forEach(ev=>$('drop').addEventListener(ev,e=>{e.preventDefault();$('drop').classList.toggle('on',ev==='dragover');if(ev==='drop')upload(e.dataTransfer.files[0])}));
$('file').onchange=e=>upload(e.target.files[0]);
async function upload(f){if(!f)return;skel();$('status').textContent='Reading your résumé…';const fd=new FormData();fd.append('resume',f);ids.forEach(i=>$(i).value&&fd.append(i,$(i).value));
 try{const r=await fetch('/api/resume',{method:'POST',body:fd}),d=await r.json();if(!r.ok)throw Error(d.error);
 $('profile').innerHTML=`<div class="chips">${d.profile.title?`<span class="chip red">${E(d.profile.title)}</span>`:''}<span class="chip">${d.profile.years} yrs</span>${d.profile.skills.map(s=>`<span class="chip">${E(s)}</span>`).join('')}</div>`;
 show(d,' matched to your résumé');if(d.note)$('status').textContent=d.note}catch(x){fail(x.message)}}
links();search();
</script></body></html>
